name: Claude build

# Labelling a ready-for-agent issue claude-build starts unattended work on it.
on:
  issues:
    types: [labeled]

jobs:
  build:
    if: >-
      github.event.label.name == 'claude-build' &&
      contains(github.event.issue.labels.*.name, 'ready-for-agent')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - name: Refuse a spec or a map
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          subs=$(gh api "repos/${{ github.repository }}/issues/${{ github.event.issue.number }}" --jq '.sub_issues_summary.total // 0')
          if [ "$subs" -gt 0 ]; then
            echo "::error::#${{ github.event.issue.number }} has $subs sub-issues: a spec or a map is never built unattended."
            exit 1
          fi

      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          label_trigger: claude-build
          include_comments_by_actor: OrMizrahi12
          plugin_marketplaces: https://github.com/anthropics/claude-plugins-official.git
          plugins: mattpocock-skills@claude-plugins-official
          claude_args: |
            --model claude-opus-5-5
            --permission-mode acceptEdits
            --allowedTools "Skill,Bash(npm test:*),Bash(npm run check),Bash(gh pr create:*)"
            --disallowedTools "Agent,Task,Bash(gh pr merge:*)"
            --append-system-prompt "Work test-first with the mattpocock-skills:tdd skill. When npm run check passes, open the PR yourself with gh pr create. Never merge."

      - name: Print which model ran
        if: always() && steps.claude.outputs.execution_file != ''
        run: >-
          jq -r '[.[] | select(.type == "assistant") | .message.model] | unique | "Model: " + join(", ")' "${{ steps.claude.outputs.execution_file }}"
