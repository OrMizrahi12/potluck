name: Smoke test

# When Vercel says a production build of main succeeded, wait until the
# production address reports that commit in /api/health, run the read-only
# smoke test there, and report a "Smoke test" status on the commit (#69).
# Until a deployment check holds the release back, the smoke test runs on the
# release itself: a failure holds nothing back, and a person rolls back
# (`vercel rollback`). A commit a later release replaced before its smoke test
# ran passes untested, and says so.
#
# Needs, outside the repo: repository dispatch events switched on in the Vercel
# project's Git settings. GitHub only runs a repository_dispatch workflow from
# the default branch, so this starts working once it's on main.

on:
  repository_dispatch:
    types: [vercel.deployment.success]
  workflow_dispatch:
    inputs:
      commit:
        description: Full SHA of a commit on main that production should report
        required: true

permissions:
  contents: read
  statuses: write

concurrency:
  group: smoke-${{ github.event.client_payload.git.sha || inputs.commit }}

jobs:
  smoke:
    name: Smoke test production
    if: github.event_name == 'workflow_dispatch' || github.event.client_payload.environment == 'production'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Payload values reach the shell only through the environment, never
      # spliced into a script.
      COMMIT: ${{ github.event.client_payload.git.sha || inputs.commit }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check the commit
        run: |
          if ! [[ "$COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::The commit to smoke-test isn't a full commit SHA."
            exit 1
          fi

      - name: Mark the commit pending
        id: pending
        run: >
          gh api "repos/$GITHUB_REPOSITORY/statuses/$COMMIT"
          -f state=pending -f context="Smoke test"
          -f description="Waiting for production to report this commit"
          -f target_url="$RUN_URL" --silent

      - uses: actions/checkout@v5
        with:
          ref: ${{ env.COMMIT }}
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc

      - name: Smoke test
        id: smoke
        env:
          # The production address. Changing it is a one-way door
          # (docs/agents/what-stays-human.md).
          PRODUCTION_URL: https://potluck-zeta.vercel.app
          SMOKE_COMMIT: ${{ env.COMMIT }}
        run: node scripts/smoke-production.mjs

      - name: Report the result on the commit
        # Whenever the commit was marked pending, so it never stays pending.
        if: always() && steps.pending.outcome == 'success'
        env:
          OUTCOME: ${{ steps.smoke.outcome }}
          SUMMARY: ${{ steps.smoke.outputs.summary }}
        run: |
          if [[ "$OUTCOME" == success ]]; then state=success; else state=failure; fi
          description="${SUMMARY:-Smoke test didn't finish: see the run}"
          gh api "repos/$GITHUB_REPOSITORY/statuses/$COMMIT" \
            -f state="$state" -f context="Smoke test" \
            -f description="$description" \
            -f target_url="$RUN_URL" --silent
