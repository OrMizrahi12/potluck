name: Check

# Runs on every push, and again when a PR's body is edited: the migration
# check (#64) reads the body's "Stops using: #N" line, and editing the body
# doesn't push. The newest run on the head commit is the one the required
# check reads.
on:
  push:
  pull_request:
    types: [edited]

permissions:
  contents: read
  # The migration check reads the PR's body, the stop-using PR and the
  # Production deployments Vercel records on GitHub.
  pull-requests: read
  deployments: read

jobs:
  check:
    name: Type-check, lint and service tests
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PR_BRANCH: ${{ github.head_ref || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          # The migration check compares with origin/main's history.
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
