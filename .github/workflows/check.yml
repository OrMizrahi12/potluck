name: Check

on: push

permissions:
  contents: read

jobs:
  check:
    name: Type-check, lint and service tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
