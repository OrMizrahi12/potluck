# One npm PR a week at most (#89). Each PR's preview takes a Neon branch, and
# ADR 0003 leaves room for only 8 open PRs with previews, so every update goes
# in one group. GitHub Actions versions are updated by hand.
#
# "Dependabot security updates" stays off on purpose, with alerts on: its
# security PRs open as soon as an alert fires, outside this schedule. The
# weekly PR carries the fixed versions instead.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      all-dependencies:
        patterns:
          - "*"
